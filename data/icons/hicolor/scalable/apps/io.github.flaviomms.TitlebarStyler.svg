<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d3846"/>
      <stop offset="100%" stop-color="#241f31"/>
    </linearGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#302d38"/>
      <stop offset="100%" stop-color="#26232c"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Window Body with Shadow -->
  <rect x="14" y="22" width="100" height="84" rx="12" ry="12" fill="url(#bg-grad)" filter="url(#shadow)" stroke="#4e4859" stroke-width="1"/>

  <!-- Titlebar Section -->
  <path d="M 14,34 A 12,12 0 0,1 26,22 L 102,22 A 12,12 0 0,1 114,34 L 114,48 L 14,48 Z" fill="url(#header-grad)" stroke="#4e4859" stroke-width="1"/>

  <!-- Window Header Titlebar divider line -->
  <line x1="14" y1="48" x2="114" y2="48" stroke="#1d1a24" stroke-width="1"/>

  <!-- Window Buttons (Titlebar Controls) -->
  <!-- Close Button (Red) -->
  <circle cx="28" cy="35" r="5.5" fill="#ff5f56"/>
  <!-- Minimize Button (Yellow) -->
  <circle cx="43" cy="35" r="5.5" fill="#ffbd2e"/>
  <!-- Maximize Button (Green) -->
  <circle cx="58" cy="35" r="5.5" fill="#27c93f"/>

  <!-- Content Placeholder (Minimalist Palette preview) -->
  <rect x="26" y="58" width="76" height="8" rx="4" fill="#5e5c64" opacity="0.4"/>
  <rect x="26" y="72" width="52" height="8" rx="4" fill="#5e5c64" opacity="0.3"/>
  <rect x="26" y="86" width="36" height="8" rx="4" fill="#3584e4" opacity="0.75"/>
</svg>
